- name: Install Android SDK
  run: |
    sudo apt-get update
    sudo apt-get install -y wget unzip openjdk-17-jdk

    # دانلود و استخراج SDK
    wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
    unzip -q commandlinetools-linux-9477386_latest.zip -d android-sdk

    # ساختار استاندارد cmdline-tools
    mkdir -p android-sdk/cmdline-tools
    mv android-sdk/cmdline-tools android-sdk/cmdline-tools/latest || true
    mkdir -p android-sdk/cmdline-tools/latest
    mv android-sdk/* android-sdk/cmdline-tools/latest/ || true

    export ANDROID_HOME=$PWD/android-sdk
    export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin

    # قبول تمام مجوزها به صورت خودکار
    yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

    # نصب دقیق نسخه‌های مورد نیاز
    $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "build-tools;34.0.0" || true
    $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" || true

    echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
    echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
